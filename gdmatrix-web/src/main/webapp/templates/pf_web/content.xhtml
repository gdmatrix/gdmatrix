<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:gdm="http://gdmatrix.org/faces">

  <p:outputPanel id="cnt" styleClass="app_content">
    
    <!-- the side menu is outside cnt: update it after each navigation -->
    <p:remoteCommand name="syncSideMenu" autoRun="true"
                     update="@form:side_menu_container" process="@none" />
    
    <div class="nav_path_panel flex-shrink-0 p-2">
      <p:outputPanel id="nav_path" class="nav_path">
        <ui:repeat value="#{userSessionBean.selectedMenuItem.cursorPath}" var="item" offset="1">
          <p:commandLink action="#{templateBean.show(item.mid)}"
                         process="@this"
                         update="@form:cnt"><span>#{applicationBean.translate(item.label)}</span>
          </p:commandLink>
          <ui:fragment rendered="#{not item.leaf}">
            <i class="pi pi-angle-right" />
          </ui:fragment>
        </ui:repeat>
      </p:outputPanel>
      <p:button icon="pi pi-ellipsis-h" onclick="return toggleDialogPanel('side_menu_panel', event);"
                class="ui-button-flat ui-button-plain side_menu_button" 
                rendered="#{userSessionBean.selectedMenuItem.directProperties.leftMenuVisible != 'false'}"/>
    </div>

    <div class="flex-grow-1 flex flex-row">
      <div class="app_body flex-grow-1 overflow-auto">
        <ui:include src="#{templateBean.content}"></ui:include>
      </div>
    </div>

    <script>
      loadNodeCss("#{pageContext.request.contextPath}", #{userSessionBean.getNodeCSSAsJson()});
      showContent("#{userSessionBean.selectedMenuItem.mid}");
      var elem = document.querySelector(".content_footer");
      elem.classList.remove("normal");
      elem.classList.remove("minimal");
      elem.classList.remove("none");
      var footerMode = "#{userSessionBean.selectedMenuItem.properties.footerMode == null ? 'normal' : userSessionBean.selectedMenuItem.properties.footerMode}";
      elem.classList.add(footerMode);
      
      // Application pages, like maps, grid(main page). The content uses the whole window
      var fullWidth = "#{userSessionBean.selectedMenuItem.properties.fullWidth}";
      var pageFull = fullWidth === "true" ? true
                   : fullWidth === "false" ? false
                   : (footerMode === "minimal" || footerMode === "none");
      document.body.classList.toggle("page-full", pageFull);
      document.body.classList.toggle("side-off",
          "#{userSessionBean.selectedMenuItem.directProperties.leftMenuVisible}" === "false");
      // Assistant switched off in pages like maps (now, also on the first load,
      // so it does not show while the page loads)
      document.body.dataset.mid = "#{userSessionBean.selectedMenuItem.mid}";
      document.body.classList.toggle("page-asst-off",
          "#{userSessionBean.selectedMenuItem.properties.assistantClosedByDefault}" === "true");
      switchAssistantForPage();
      // Assistant size for the new page (on the first load, the header's
      // load handler does it once the assistant exists)
      if (document.readyState === "complete") sizeAssistantForPage();
      
    // Publishes the breadcrumb height so the side panels start below it
    var breadcrumb = document.querySelector(".nav_path_panel");
    if (breadcrumb)
    {
      if (window._breadcrumbObserver) window._breadcrumbObserver.disconnect();
      if (window.ResizeObserver)
      {
        window._breadcrumbObserver = new ResizeObserver(function(entries){
          document.body.style.setProperty("--breadcrumb-height", entries[0].target.offsetHeight + "px");
        });
        window._breadcrumbObserver.observe(breadcrumb);
      }
    }
    </script>      
 
  </p:outputPanel>

</ui:composition>
