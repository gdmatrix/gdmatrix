<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:gdm="http://gdmatrix.org/faces">
  <h:panelGroup id="config_sb" layout="block" 
                class="config_panel dialog_panel header_sheet" >
    <div class="ui-widget flex flex-column w-full h-full">
      <p:outputPanel class="sheet_body overflow-auto flex-grow-1">
        <div class="sheet_columns">

          <!-- Language and Font size -->
          <div class="sheet_column">
            <div class="sheet_section">
              <h:outputLabel id="language_label" styleClass="sheet_title"
                             pt:for="mainform:language_selector_input">
                <i class="pi pi-globe"/>#{webBundle.language}
              </h:outputLabel>
              <p:selectOneMenu id="language_selector" value="#{userSessionBean.viewLanguage}"
                               styleClass="w-full">
                <p:ajax event="valueChange" process="@this"
                        update="menubar login_sb language_label font_label font_sample 
                        theme_label save_prefs assistant_dock @form:cnt global_confirm_dialog" />
                <f:selectItems value="#{userSessionBean.supportedLocales}" var="locale"
                               itemValue="#{locale.language}" itemLabel="#{locale.getDisplayName(locale)} (#{locale.language})" />
              </p:selectOneMenu>
            </div>

            <div class="sheet_section">
              <h:panelGroup id="font_label" layout="block" styleClass="sheet_title">
                <span class="sheet_title_text" aria-hidden="true">Aa</span>#{webBundle.fontSize}
              </h:panelGroup>
              <div class="font_slider">
                <span class="font_slider_min" aria-hidden="true">A</span>
                <h:inputHidden id="font_size" value="#{userSessionBean.fontSize}" />
                <p:slider for="font_size" minValue="12" maxValue="18" step="1"
                          styleClass="flex-grow-1" onSlide="updateFontSize(ui.value)">
                  <p:ajax event="slideEnd" process="font_size" update="@none" global="false" />
                </p:slider>
                <span class="font_slider_max" aria-hidden="true">A</span>
              </div>
              <h:panelGroup id="font_sample" layout="block" styleClass="font_sample">
                #{webBundle.sampleText}
              </h:panelGroup>
            </div>
          </div>

          <!-- Themes and Save -->
          <div class="sheet_column">
            <div class="sheet_section">
              <h:panelGroup id="theme_label" layout="block" styleClass="sheet_title">
                <i class="pi pi-palette" />#{webBundle.themes}
              </h:panelGroup>
              <p:selectOneRadio id="theme_selector" layout="custom" widgetVar="themeSelector"
                                pt:aria-labelledby="mainform:theme_label"
                                value="#{userSessionBean.primefacesTheme}">
                <p:ajax oncomplete="PrimeFaces.changeTheme(PF('themeSelector').inputs.filter(':checked').val());" />
                <f:selectItems value="#{userSessionBean.primefacesThemeSelectItems}" />
              </p:selectOneRadio>
              <!-- Theme cards: the label points to the radio clone, so the
                   widget handles the click and updates the real input -->
              <div class="theme_cards">
                <c:forEach items="#{userSessionBean.primefacesThemeSelectItems}" var="theme" varStatus="loop">
                  <label class="theme_card" for="mainform:theme_selector:#{loop.index}_clone">
                    <span class="theme_preview theme_preview_#{theme.value}" aria-hidden="true"/>
                    <span class="theme_card_name">
                      #{theme.label}
                      <p:radioButton for="theme_selector" itemIndex="#{loop.index}"/>
                    </span>
                  </label>
                </c:forEach>
              </div>
            </div>

            <div class="sheet_actions sheet_actions_end">
          <p:commandButton id="save_prefs"
                           action="#{templateBean.savePreferences}" icon="pi pi-save"
                           value="#{webBundle.savePreferences}"
                           rendered="#{userSessionBean.isPersistentUser()}"
                           process="@this" update="@none" />
            </div>
          </div>
        </div>
      </p:outputPanel>
    </div>
  </h:panelGroup>
</ui:composition>
