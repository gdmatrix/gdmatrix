<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:gdm="http://gdmatrix.org/faces">
  <!-- header -->
  <div class="app_header">
    <!-- three zones: brand, main menu and toolbar -->
    <h:panelGroup id="menubar" layout="block" class="app_menubar">

      <div class="header_brand">
        <div class="menu_button">
          <p:button onclick="hideDialogPanels();return showDialogPanel('main_menu_panel', event);"
                    icon="pi pi-bars" class="rounded-button ui-button-flat" />
        </div>

        <!-- logo: SVG sprite with the shield and the text as separate symbols,
             painted in template.css; logo_compact replaces logo_full in compact mode -->
        <a href="#{userSessionBean.selectedMenuItem.properties.homeUrl}" class="logo"
           aria-label="Ajuntament de Sant Feliu de Llobregat">
          <svg class="logo_full" viewBox="0 0 37.192671 16.899341" aria-hidden="true">
            <use class="logo_escut" href="/documents/6612405/Escut_ajuntament_no.svg#escut"/>
            <use class="logo_text" href="/documents/6612405/Escut_ajuntament_no.svg#text"/>
          </svg>
          <svg class="logo_compact" viewBox="0 0 267.40725 62.506381" aria-hidden="true">
            <use class="logo_escut" href="/documents/6612405/Escut_ajuntament_no.svg#escut_small"/>
            <use class="logo_text" href="/documents/6612405/Escut_ajuntament_no.svg#text_small"/>
          </svg>
        </a>
      </div>

      <div class="main_menu_panel dialog_panel">

        <div class="header">
          <div class="flex-grow-1 font-bold">
            #{applicationBean.translate(userSessionBean.selectedMenuItem.properties.description)}
          </div>
          <p:button onclick="return hideDialogPanel('main_menu_panel', event)"
                    icon="pi pi-times" styleClass="text-color rounded-button ui-button-flat" />
        </div>
        <nav class="menu-principal" aria-label="#{webBundle.menu}">
          <sf:treeMenu id="main_menu" var="item" expandDepth="3"
                       styleClass="main_menu flex-grow-0"
                       baseMid="#{userSessionBean.selectedMenuItem.path[1]}">
            <f:facet name="data">
              <ui:fragment rendered="#{item.rendered}">
                <div class="menuitem">
                  <!-- node with children: a single button that only opens the submenu -->
                  <ui:fragment rendered="#{not item.leaf}">
                    <a href="#" class="entry toggle ui-commandlink ui-widget" role="button">
                      <ui:fragment rendered="#{item.directProperties.icon != null}">
                        <i class="ui-icon #{item.directProperties.icon} mr-1" />
                      </ui:fragment>
                      <div>#{applicationBean.translate(item.label)}</div>
                      <span class="caret" aria-hidden="true"><i class="pi pi-chevron-right" /></span>
                    </a>
                  </ui:fragment>

                  <p:commandLink action="#{templateBean.show(item.mid)}"
                                 rendered="#{item.action != 'url'}"
                                 process="@form:menubar"
                                 update="@form:cnt"
                                 styleClass="entry nav">
                    <ui:fragment rendered="#{item.directProperties.icon != null}">
                      <i class="ui-icon #{item.directProperties.icon} mr-1" />
                    </ui:fragment>
                    <div>#{applicationBean.translate(item.label)}</div>
                  </p:commandLink>
                  <p:link href="#{item.properties.url}"
                          rendered="#{item.action == 'url'}"
                          styleClass="entry nav"
                          onclick="hideDialogPanel('main_menu_panel')"
                          target="#{item.properties.target == null ? '_self' : item.properties.target}">
                    <ui:fragment rendered="#{item.directProperties.icon != null}">
                      <i class="ui-icon #{item.directProperties.icon} mr-1" />
                    </ui:fragment>
                    #{applicationBean.translate(item.label)}
                  </p:link>

                </div>
              </ui:fragment>
            </f:facet>
          </sf:treeMenu>
        </nav>
      </div>

      <div class="user_toolbar">
        <ui:fragment rendered="#{userSessionBean.anonymousUser}">
          <button type="button"
                  class="header_icon_button login_button"
                  title="#{webBundle.identification}"
                  onmousedown="event.preventDefault()"
                  onclick="toggleHeaderSheet('login_panel', event); enableUserPassButton(); return false;">
            <svg class="header_icon" aria-hidden="true">
              <use href="/documents/6586293/usericon.svg#usericon"/>
            </svg>
          </button>
        </ui:fragment>

        <ui:fragment rendered="#{not userSessionBean.anonymousUser}">
          <button type="button"
                  class="header_icon_button login_button"
                  title="#{userSessionBean.displayName}"
                  onmousedown="event.preventDefault()"
                  onclick="return toggleHeaderSheet('login_panel', event);">
            <span class="user_initial">#{templateBean.userInitial}</span>
          </button>
        </ui:fragment>

        <button type="button"
                class="header_icon_button config_button"
                title="#{webBundle.configuration}"
                onmousedown="event.preventDefault()"
                onclick="return toggleHeaderSheet('config_panel', event);">
          <svg class="header_icon" aria-hidden="true">
            <use href="/documents/6584153/settingsicon.svg#settingsicon"/>
          </svg>
        </button>

        <button type="button"
                class="header_icon_button assistant_button"
                title="Assistant" aria-label="Assistant" aria-pressed="true"
                onclick="animateAssistantButton(this); toggleAssistantVisibility(event)">
          <svg class="header_icon" aria-hidden="true">
            <use class="icon_on" href="/documents/6584160/chaboxonicon.svg#chatboxonicon"/>
            <use class="icon_off" href="/documents/6584159/chatboxofficon.svg#chatboxofficon"/>
          </svg>
        </button>
      </div>

      <script>
        //<![CDATA[
        var menuSetup = {
          mainMenuClass: "main_menu",
          megaMenu: true, // Option to use Sheet menu
          compactWhenNoFit: true, // compact (mobile) menu when the bar does not fit
          focusDialogs: true,
          maxItemsPerSubMenu: 8,
          horizontal: {
            multiDrop: false,
            hoverDrop: false
          },
          vertical: {
            multiDrop: true,
            hoverDrop: false
          }
        };
        initMenu();

        // ResizeObserver of the open panel: created once in the load handler
        var sheetObserver;

        function toggleHeaderSheet(panelClass, event)
        {
          var panel = document.querySelector(".app_header > ." + panelClass);
          if (!panel) return false;
          if (panel.classList.contains("show")) return hideDialogPanel(panel, event);

          // unfold only if the card was closed. Otherwise only the content changes
          var header = panel.closest(".app_header");
          var cardOpen = !!header.querySelector(".main_menu.mega > ul > li.drop, :scope > .header_sheet.show");
          hideDialogPanels();
          panel.classList.toggle("sheet_opening", !cardOpen);
          showDialogPanel(panel, event);
          closeSubMenus();
          updateMenuLayout();
          if (sheetObserver) sheetObserver.observe(panel);
          return false;
        }

        function hideHeaderSheets()
        {
          document.querySelectorAll(".app_header > .header_sheet.show").forEach(function(panel)
          {
            hideDialogPanel(panel);
          });
        }

        function isAssistantClosed()
        {
          return document.body.classList.contains("asst-off");
        }

        function setAssistantOff(off)
        {
          document.body.classList.toggle("asst-off", off);
          updateAssistantButton();

          // in full screen the assistant hides the content
          var contentPanel = document.querySelector(".content_footer");
          if (contentPanel)
          {
            contentPanel.classList.toggle("hidden",
              !off && document.body.classList.contains("asst-full"));
          }
        }

        function toggleAssistantVisibility(event)
        {
          if (event) event.preventDefault();

          document.body.classList.remove("asst-auto-off");
          setAssistantOff(!isAssistantClosed());
          rememberAssistantChoice(isAssistantClosed() ? "off" : null);

          if (!isAssistantClosed())
          {
            activateAssistantTextarea();
          }
        }

        // Pages with assistantClosedByDefault=true (ej.maps) switch to full
        var assistantAutoOffMid;

        function switchAssistantForPage()
        {
          var body = document.body;
          if (body.classList.contains("page-asst-off"))
          {
            if (assistantAutoOffMid === body.dataset.mid) return;
            assistantAutoOffMid = body.dataset.mid;
            if (getAssistantChoice() !== "off") // switched off by the user: nothing to undo later
            {
              body.classList.add("asst-auto-off");
              setAssistantOff(true);
            }
          }
          else
          {
            assistantAutoOffMid = null;
            if (body.classList.contains("asst-auto-off"))
            {
              body.classList.remove("asst-auto-off");
              setAssistantOff(false);
            }
          }
        }

        
        // Marks on the <body> the assistant current size
        function setAssistantSize(size)
        {
          document.body.classList.remove("asst-min", "asst-half", "asst-full");
          document.body.classList.add("asst-" + size);
        }
        
        function syncThreadsPanel(size)
        {
          if(!PrimeFaces.widgets["threadsPanel"]) return;
          if (size === "full")
          {
            var container = document.querySelector(".assistant_container");
            if (container && container.clientWidth >= 700) showThreadsPanel();
          }
          else
          {
            closeThreadsPanel();
          }
        }
        
        // Shows the assistant panel at the given size: full, half or min
        function setAssistantPanel(size)
        {
          document.querySelector(".content_footer").classList.toggle("hidden", size === "full");
          document.querySelector(".assistant_panel").classList.toggle("hidden", size === "min");

          setAssistantSize(size);
          syncThreadsPanel(size);
          if (typeof updateWsmSelection === "function") updateWsmSelection(size);
        }

        // The user's choice for this browser session.
        function getAssistantChoice()
        {
          try { return sessionStorage.getItem("assistantChoice"); }
          catch (e) { return null; }
        }

        function rememberAssistantChoice(choice)
        {
          try
          {
            if (choice) sessionStorage.setItem("assistantChoice", choice);
            else sessionStorage.removeItem("assistantChoice");
          }
          catch (e) {}
        }

        function rememberAssistantThread(threadId)
        {
          try { sessionStorage.setItem("assistantThread", threadId); }
          catch (e) {}
        }

        function forgetAssistantThread()
        {
          try { sessionStorage.removeItem("assistantThread"); }
          catch (e) {}
        }

        function restoreRememberedThread()
        {
          var threadId;
          try { threadId = sessionStorage.getItem("assistantThread"); }
          catch (e) { return; }
          // a thread in the URL (?threadid=) wins
          if (!threadId || /[?&]threadid=/.test(location.search)) return;
          restoreAssistantThread([{ name: "threadId", value: threadId }]);
        }

        // Size the page asks for: half on content pages, min on full width pages.
        function sizeAssistantForPage()
        {
          if (window.matchMedia("(max-width: 800px)").matches) return;

          var pageFull = document.body.classList.contains("page-full");
          setAssistantPanel(pageFull || getAssistantChoice() === "min" ? "min" : "half");
        }

        function activateAssistantTextarea()
        {
          if (PrimeFaces.widgets["assistantTextarea"])
          {
            PF("assistantTextarea").render();
            PF("assistantTextarea").jq.focus();
          }          
        }
        
        function updateAssistantButton()
        {
          var button = document.querySelector(".assistant_button");
          if (!button) return;
          var closed = isAssistantClosed();
          button.title = closed ? "Assistant OFF" : "Assistant ON";
          button.setAttribute("aria-label", "Assistant");
          button.setAttribute("aria-pressed", closed ? "false" : "true");
        }
        
        function animateAssistantButton(button)
        {
          if (!button)
          {
            button = document.querySelector(".assistant_button");
          }
          
          button.classList.remove("assistant_clicked");

          void button.offsetWidth;

          button.classList.add("assistant_clicked");

          setTimeout(function()
          {
            button.classList.remove("assistant_clicked");
          }, 400);
        }
        
        window.addEventListener("load", () => {
          updateFontSize(#{userSessionBean.fontSize});

          // Initial state
          if (getAssistantChoice() === "off") document.body.classList.add("asst-off");
          sizeAssistantForPage();
          restoreRememberedThread();

          updateAssistantButton();
          // Publish the actual height of the floating bar in --dock-height.
          var dock = document.querySelector(".assistant-dock");
          if (dock && window.ResizeObserver)
          {
            new ResizeObserver(function(entries){
              document.body.style.setProperty("--dock-height", entries[0].target.offsetHeight + "px");
            }).observe(dock);
          }
          
          var pageBand = document.querySelector(".page_band");
          if (pageBand && window.ResizeObserver)
          {
            new ResizeObserver(function(entries){
              document.body.style.setProperty("--header-height", entries[0].target.offsetHeight + "px");
            }).observe(pageBand);
          }
          
          // the card (.app_header::after) takes the height of the open panel
          if (window.ResizeObserver)
          {
            // switching panels gives two entries (hidden one and shown one)
            sheetObserver = new ResizeObserver(function(entries)
            {
              entries.forEach(function(entry)
              {
                var panel = entry.target;
                if (panel.classList.contains("show"))
                {
                  panel.closest(".app_header").style.setProperty("--mega-panel-height", panel.offsetHeight + "px");
                }
              });
            });
          }

          // opening a menu tab closes the panels. But never closes the sheet.
          document.querySelector(".app_header").addEventListener("click", function(event)
          {
            if (!event.target.closest(".main_menu.mega > ul > li > .menuitem")) return;
            if (!document.querySelector(".app_header > .header_sheet.show")) return;
            requestAnimationFrame(function()
            {
              hideHeaderSheets();
              var mainMenu = document.querySelector(".main_menu.mega");
              if (mainMenu) mainMenu.classList.remove("mega_opening");
            });
          }, true);
          
          document.addEventListener("keydown", function(event)
          {
            if (event.key !== "Escape" || event.defaultPrevented) return;
            var panel = document.querySelector(".app_header > .header_sheet.show");
            if (panel)
            {
              hideDialogPanel(panel, event);
            }
          });
        });

        //]]>
      </script>
    </h:panelGroup>
    
    <!-- Login and Config panels inside the sheet -->
    <ui:include src="login.xhtml"></ui:include>
    <ui:include src="configuration.xhtml"></ui:include>
  </div>

</ui:composition>
