<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pe="http://primefaces.org/ui/extensions"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:gdm="http://gdmatrix.org/faces">

  <p:messages showSummary="true" styleClass="messages" 
              showIcon="true" closable="false" forIgnores="growl" class="pl-2 pr-2">
    <p:autoUpdate />
  </p:messages>

  <div id="placeholder" style="width:100%;height:100%;"></div>
  <script>
    async function loadScript(url) 
    {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    // Main function
    async function init() 
    {
      try {
        var onlyOffice = "#{onlyOfficeBean.onlyOfficeHost}";
        await loadScript(onlyOffice + "/web-apps/apps/api/documents/api.js");
        console.log("OnlyOffice API ready");

        const config = JSON.parse('#{onlyOfficeBean.config}');
        new DocsAPI.DocEditor("placeholder", config);
      } 
      catch (err) 
      {
        console.error("Error charging the OnlyOffice API:", err);
      }
    }
    
    var url = "/web/#{userSessionBean.selectedMenuItem.mid}";
    var params = [];

    var docId = "#{onlyOfficeBean.docId}";
    var accessMode = "#{onlyOfficeBean.accessMode}";

    if (docId) params.push("docId=" + encodeURIComponent(docId));
    if (accessMode) params.push("accessMode=" + encodeURIComponent(accessMode));

    if (params.length > 0)
    {
      url += "?" + params.join("&amp;");
    }

    controlNavigationHistory({
      url: url,
      title: "#{userSessionBean.selectedMenuItem.label}"
    });
    
    init();
  </script>

</ui:composition>
