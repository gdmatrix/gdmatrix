<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pe="http://primefaces.org/ui/extensions"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:gdm="http://gdmatrix.org/faces"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

  <h:outputStylesheet library="css" name="ide.css" />

  <h:outputScript library="js" name="ide.js" />

  <f:loadBundle basename="org.santfeliu.doc.web.resources.DocumentBundle"
                var="documentBundle"/>

  <p:messages id="ideMessages" showSummary="true" styleClass="messages ml-3 mr-3" 
              showIcon="true" closable="true" globalOnly="true"
              forIgnores="growl login_messages dialogErrors">
    <p:autoUpdate />
  </p:messages>

  <script>
    var cmChanged = false;
    function cmOnChange(editorView, doc)
    {
      if (!cmChanged)
      {
        onDocumentChange();
        cmChanged = true;
      }
    }
  </script>

  <div class="ide_body p-0 flex flex-column h-full">

    <p:outputPanel id="header" class="header flex-grow-0 flex p-2">
      <div class="flex align-items-center">
        <p:outputLabel for="@next" value="Type:" styleClass="mr-2" />
        <p:selectOneMenu value="#{ideBean.typeName}">
          <f:selectItems value="#{ideBean.typeSelectItems}" />
          <p:ajax event="valueChange"
                  listener="#{ideBean.onTypeChange}"
                  update="@form:cnt:editor @form:cnt:name @form:cnt:ide_history"
                  onstart="cmChanged = false;"
                  process="@this editor" />
        </p:selectOneMenu>
      </div>
      <div class="flex align-items-center">
        <p:outputLabel for="@next" value="Name:" styleClass="mr-2" />
        <p:autoComplete id="name"
                        value="#{ideBean.name}" 
                        maxResults="50" var="docName"
                        scrollHeight="200"
                        itemLabel="#{docName}" itemValue="#{docName}"
                        completeMethod="#{ideBean.completeDocumentName}" 
                        forceSelection="false" styleClass="name code"
                        pt:spellcheck="false"
                        minQueryLength="2"
                        emptyMessage="">
          <p:ajax event="itemSelect"
                  listener="#{ideBean.onNameSelect}"
                  update="editor docs_panel @form:cnt:ide_history"
                  onstart="cmChanged = false;"
                  process="@this editor" />
          <p:column>
            <span class="code">#{docName}</span>
          </p:column>
        </p:autoComplete>
        <p:splitButton value="#{objectBundle.store}" 
                       title="#{objectBundle.store}" 
                       action="#{ideBean.save}" 
                       process="@form:cnt" 
                       update="@form:cnt:docs_panel @form:cnt:ide_history @(.ideTabLabel) :mainform:editor:doc_versions_table ide_confirm @form:cnt:ideMessages"
                       onstart="return checkSave();"
                       oncomplete="cmChanged = false;"
                       icon="pi pi-save" 
                       styleClass="mini ml-2 mr-2 flex flex-nowrap">
          <p:menuitem value="#{objectBundle.storeNewVersion}" 
                      title="#{objectBundle.storeNewVersion}" 
                      action="#{ideBean.saveNewVersion}" 
                      process="@form:cnt" 
                      oncomplete="cmChanged = false;"
                      update="@form:cnt:docs_panel @form:cnt:ide_history @(.ideTabLabel) :mainform:editor:doc_versions_table ide_confirm @form:cnt:ideMessages"
                      icon="pi pi-save" styleClass="mini" />
        </p:splitButton>          
        <div class="ui-inputgroup ml-1">
          <p:commandButton action="#{ideBean.create}"
                           process="@form:cnt" update="@form:cnt"
                           icon="pi pi-plus-circle" 
                           alt="#{objectBundle.create}" 
                           title="#{objectBundle.create}" />
          <p:commandButton action="#{ideBean.load}"
                           process="@form:cnt" update="@form:cnt"
                           icon="pi pi-refresh"
                           alt="#{objectBundle.load}" 
                           title="#{objectBundle.load}"/>
        </div> 
            
        <!-- Ide config -->
        <div class="flex align-items-center ml-5">
          <p:commandButton id="ideConfigBtn" icon="pi pi-cog" 
                           styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-icon-only"
                           title="#{webBundle.ideConfig}"
                           process="@this"
                           update="configDialogContent"
                           oncomplete="PF('configDialog').show();">
             <p:resetInput target="configDialogContent" />
          </p:commandButton>

          <p:dialog id="configDialog" widgetVar="configDialog" header="#{webBundle.ideConfig}" 
                    modal="true" responsive="true" resizable="false" width="350" 
                    closable="false" closeOnEscape="false" appendTo="@(form)">
            
            <p:outputPanel id="configDialogContent">
              <div class="flex flex-column gap-3 p-2">
                
                <div class="flex align-items-center justify-content-between">
                  <p:outputLabel for="tabSwitch" value="Indent with Tab:" />
                  <p:toggleSwitch id="tabSwitch" value="#{ideBean.ideConfig['indentWithTab']}" />
                </div>
                
                <div class="flex align-items-center justify-content-between">
                  <p:outputLabel for="lineWrappingSwitch" value="Line Wrapping:"/>
                  <p:toggleSwitch id="lineWrappingSwitch" value="#{ideBean.ideConfig['lineWrapping']}"/>               
                </div>
                <!-- Add here the rest of configurable extensions -->

                <div class="flex justify-content-end mt-2 gap-2"> 
                  <p:commandButton value="#{objectBundle.cancel}" icon="pi pi-times" 
                                   process="@this" 
                                   update="configDialogContent" 
                                   oncomplete="PF('configDialog').hide();" 
                                   styleClass="ui-button-sm mini">
                      <p:resetInput target="configDialogContent" />
                  </p:commandButton>                              
                  <p:commandButton value="#{objectBundle.store}" icon="pi pi-save" 
                                   actionListener="#{ideBean.saveIdeConfig}" 
                                   process="configDialogContent @form:cnt:editor" 
                                   update="@form:cnt:editor" 
                                   oncomplete="PF('configDialog').hide();" 
                                   styleClass="ui-button-sm mini" />
                </div>        
              </div>
            </p:outputPanel>
          </p:dialog>
        </div>
        
        
        <!-- Add here the rest of configurable extensions  -->
        <p:button title="Documents"
                  widgetVar="docsPanelButton"
                  onclick="return showPanel()"
                  icon="pi pi-copy"
                  styleClass="ml-2 mini white-space-nowrap docs_panel_button first_time" />
      </div>
    </p:outputPanel>

    <div class="flex-grow-1 pt-0 flex w-full overflow-x-hidden overflow-y-hidden">
      <p:tabView dynamic="true" styleClass="editor h-full overflow-hidden flex-grow-1" id="editor" 
                 widgetVar="ideTabs">
        <c:forEach items="#{ideBean.tabs}" var="tab">
          <p:tab>
            <f:facet name="title">
              <span class="#{tab.icon} mr-2"/>
              <p:outputLabel styleClass="ideTabLabel" 
                             value="#{tab.label}#{tab.editor and ideBean.document.modified ? ' *' : ''}" />
            </f:facet>
            <ui:include src="#{tab.viewId}" />
          </p:tab>
        </c:forEach>
      </p:tabView>

      <p:panel id="docs_panel" styleClass="docs_panel flex-grow-0 v-full first_time h-full"
               widgetVar="docsPanel" closeSpeed="50" style="min-width:300px;">
        <f:facet name="header"> 
          <i class="pi pi-copy vertical-align-middle m-1"></i>

          <span>Documents</span>
          <p:commandLink onclick="return closePanel();"
                         class="ui-panel-titlebar-icon ui-corner-all ui-state-default">
            <span class="ui-icon ui-icon-closethick"></span>
          </p:commandLink>
        </f:facet>

        <ul>
          <ui:repeat value="#{ideDocumentCacheBean.documents}" var="document">
            <li class="flex w-full align-items-center">
              <p:commandLink action="#{ideBean.loadCache(document.reference)}"
                             process="@form:cnt"   update="@form:cnt @form:cnt:docs_panel @form:cnt:ideMessages" 
                             class="flex-grow-1 no-underline p-2">
                <span class="#{ideBean.getDocumentIcon(document)} ml-1 mr-1" />
                <span class="code">#{document.name}#{document.modified ? ' *' : ''}</span>                
              </p:commandLink>

              <p:commandButton styleClass="ui-button-flat ml-3 flex-grow-0" icon="pi pi-times" 
                               action="#{ideBean.remove(document.reference)}"
                               process="@form:cnt" update="@form:cnt:docs_panel @form:cnt:ideMessages" />
            </li>
          </ui:repeat>
        </ul>        
      </p:panel>
    </div>

  </div>

  <gdm:saveBean value="ideBean" /> 

  <p:remoteCommand action="#{ideBean.refreshSession()}" name="refreshSession" 
                   process="@none" update="@none" /> 

  <p:remoteCommand id="markChangedCommand"
                   name="onDocumentChange" actionListener="#{ideBean.markChanged}" 
                   process="@this"
                   update="@(.ideTabLabel) @form:cnt:docs_panel @form:cnt:ideMessages ide_confirm" />

  <p:growl for="growl" life="1500" >
    <p:autoUpdate />
  </p:growl>            

  <p:outputPanel id="ide_history">
    <script>
      controlNavigationHistory(#{ideBean.jsonPageState});

      if (!window._refreshSessionTimerId)
      {
        const minutes = 10; // refresh session interval
        window._refreshSessionTimerId = setInterval(() => refreshSession(), minutes * 60 * 1000);
      }
    </script>
  </p:outputPanel>

  <p:outputPanel id="ide_confirm">
    <script>
      function checkSave()
      {
        var showConfirm = '#{ideBean.document.confirmSave}';
        if (showConfirm == 'true')
        {
          if (!confirm('#{documentBundle.document_version_overwrite}'))
          {
            return false;
          }
        }
        return true;
      }
    </script>
  </p:outputPanel>

  <!-- Confirm save with errors dialog -->
  <p:dialog id="dialogSaveWithErrors" widgetVar="confirmSaveDialog" styleClass="edit_data_dialog mw_600"
            header="#{documentBundle.ide_errorsDetected}" modal="true" responsive="true" 
            closable="false" position="center center" resizable="false"
            onShow="PF('confirmSaveDialog').resetPosition();" >

    <h:outputText value="#{documentBundle.ide_errorsDetected_message}"  />
    <p:messages id="dialogErrors" showDetail="true" showSummary="false" />
    <p:separator/>
    <div class="flex justify-content-end mt-2">
      <p:commandButton value="Si" 
                       actionListener="#{ideBean.confirmSaveYes}" 
                       update="@form:cnt @form:cnt:ideMessages ide_history docs_panel dialogErrors" 
                       oncomplete="PF('confirmSaveDialog').hide();" 
                       icon="pi pi-check" styleClass="mr-2"/>
      <p:commandButton value="No" 
                       actionListener="#{ideBean.confirmSaveNo}" 
                       type="button"
                       onclick="PF('confirmSaveDialog').hide();" 
                       icon="pi pi-times"/>
    </div>
  </p:dialog>
</ui:composition>
