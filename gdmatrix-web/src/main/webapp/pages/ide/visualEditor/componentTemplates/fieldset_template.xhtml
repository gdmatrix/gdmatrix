<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
  
  <p:fieldset legend="#{currentBlock.element.legendText}" 
              styleClass="w-full">

    <h:panelGroup rendered="#{not empty currentBlock.childrenBlocks}" 
                  layout="block"
                  pt:data-container-id="#{currentBlock.element.id}"
                  styleClass="flex flex-wrap gap-2">

      <c:forEach items="#{currentBlock.childrenBlocks}" var="childBlock">
        <c:if test="#{not empty childBlock.element}">
          <h:panelGroup layout="block"
                        pt:data-element-id="#{childBlock.element.id}"
                        pt:data-is-fieldset="false"
                        pt:onclick="event.stopPropagation(); rcSelectElement([{name:'elementId', value:'#{childBlock.element.id}'}])"
                        styleClass="field relative p-2 border-round cursor-pointer transition-colors transition-duration-200 border-2 border-solid
                                    #{not empty visualEditorBean.selectedView and visualEditorBean.selectedView.id eq childBlock.element.id ? 'surface-hover border-primary' : 'border-transparent hover:surface-100'}">
            <!-- Drag handle -->
            <c:if test="#{not empty visualEditorBean.selectedView and visualEditorBean.selectedView.id eq childBlock.element.id}">
              <div class="drag-handle absolute top-0 left-0 w-1rem h-1rem bg-primary border-round shadow-2 z-5 flex align-items-center justify-content-center"
                   style="transform: translate(-50%, -50%); cursor: move; touch-action: none;"
                   onpointerdown="initDragMove(event, this.closest('.field'), '#{childBlock.element.id}', '#{childBlock.element.nativeViewType}', '#{childBlock.element.inputType}')">
                <i class="pi pi-arrows-alt text-xs text-white"></i>
              </div>
            </c:if>

            <ui:include src="/pages/ide/visualEditor/componentTemplates/#{visualEditorBean.getDynamicTemplateFileFor(childBlock.element)}">
              <ui:param name="elementObj" value="#{childBlock.element}"/>
              <ui:param name="currentBlock" value="#{childBlock}"/>
            </ui:include>
          </h:panelGroup>
        </c:if>
      </c:forEach>

    </h:panelGroup>
    
    <h:panelGroup rendered="#{empty currentBlock.childrenBlocks}"
                  layout="block"
                  pt:data-container-id="#{currentBlock.element.id}"
                  styleClass="flex align-items-center justify-content-center w-full border-1 border-dashed border-300 border-round"
                  style="min-height: 4rem;">
      <h:outputText value="Select this fieldset and add items from the menu"
                    styleClass="text-400 text-sm font-italic text-center"/>
    </h:panelGroup>
  </p:fieldset>
</ui:composition>
