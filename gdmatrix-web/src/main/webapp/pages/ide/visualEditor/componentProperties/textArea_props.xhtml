<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:fn="http://java.sun.com/jsp/jstl/functions">

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="Label Text" class="font-bold text-sm text-primary"/>
    <p:inputText value="#{visualEditorBean.associatedLabelText}" styleClass="w-full"/>
  </div>

  <!-- Select renderer -->
  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="Renderer" class="font-bold text-sm text-primary" />
    <p:selectOneMenu widgetVar="rendererModeDropdown"
                     value="#{visualEditorBean.elementProps.renderer}"
                     styleClass="w-full">
      <f:selectItem itemLabel="TextArea" itemValue=""/>
      <f:selectItem itemLabel="Quill (Rich text)" itemValue="quill"/>
      <f:selectItem itemLabel="Tiny MCE" itemValue="tinymce"/>
      <f:selectItem itemLabel="CodeMirror" itemValue="codemirror:html"/> 
    </p:selectOneMenu>
  </div>

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="HelpText" class="font-bold text-sm text-primary"/>
    <p:inputText value="#{visualEditorBean.elementProps.helpText}" styleClass="w-full"/>
  </div>

  <div class="flex gap-2 mt-3">
    <p:selectBooleanCheckbox value="#{visualEditorBean.elementProps.required}" />
    <p:outputLabel value="Required" class="font-bold text-sm"/>
  </div>

  <div class="flex gap-2 mt-2">
    <p:selectBooleanCheckbox value="#{visualEditorBean.elementProps.disabled}" />
    <p:outputLabel value="Disabled" class="font-bold text-sm"/>
  </div>
</ui:composition>
