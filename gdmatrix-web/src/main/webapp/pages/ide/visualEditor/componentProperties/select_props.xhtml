<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:gdm="http://gdmatrix.org/faces"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="Label Text" class="font-bold text-sm text-primary"/>
    <p:inputText value="#{visualEditorBean.associatedLabelText}" styleClass="w-full"/>
  </div>

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="Renderer" class="font-bold text-sm text-primary"/>
    <p:inputText value="#{visualEditorBean.elementProps.renderer}" styleClass="w-full"/>
  </div>

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="HelpText" class="font-bold text-sm text-primary"/>
    <p:inputText value="#{visualEditorBean.elementProps.helpText}" styleClass="w-full"/>
  </div>

  <div class="flex flex-column gap-2 mt-2">
    <p:outputLabel value="Allow multiple options?" class="font-bold text-sm text-primary"/>
    <p:selectBooleanCheckbox value="#{visualEditorBean.elementProps.multiple}" />
  </div>

  <!-- Data Origins -->
  <div class="flex flex-column gap-2 mt-4 border-top-1 border-300 pt-3">
    <p:outputLabel value="Data Origin" class="font-bold text-sm text-primary"/>

    <p:selectOneMenu widgetVar="selectModeDropdown"
                     value="#{visualEditorBean.selectedMode}"
                     onchange="toggleSelectMode(PF('selectModeDropdown').getSelectedValue())"
                     styleClass="w-full">
      <f:selectItem itemLabel="(Select option)" itemValue=""/>
      <f:selectItem itemLabel="Enum (DataRef)" itemValue="ENUM" />
      <f:selectItem itemLabel="Database(SQL)" itemValue="SQL" />
    </p:selectOneMenu>
  </div>

  <div id="panel_ENUM" class="mt-3 flex-column gap-2" style="display: none;">
    <p:outputLabel value="Dataref" class="font-bold text-sm"/>
    <p:inputText value="#{visualEditorBean.elementProps.dataRef}"
                 styleClass="w-full"
                 placeholder="ej. enumtype:sf:EstatCivil"/>
  </div>

  <div id="panel_SQL" class="mt-3 flex-column gap-2" style="display: none;">
    <p:outputLabel value="Username" class="font-bold text-sm mb-2 block"/>
    <p:inputText value="#{visualEditorBean.elementProps.username}" styleClass="w-full mb-2"/>

    <p:outputLabel value="Password" class="font-bold text-sm mb-2 block"/>
    <p:inputText value="#{visualEditorBean.elementProps.password}"
                 styleClass="w-full mb-2"/>

    <!--    <p:password value="#{visualEditorBean.elementProps.password}"
                  styleClass="w-full mb-2"
                  feedback="true"
    toggleMask="true"/>-->

    <p:outputLabel value="Connection" class="font-bold text-sm mb-2 block"/>
    <p:inputText value="#{visualEditorBean.elementProps.connection}"
                 styleClass="w-full mb-2"
                 placeholder="ej. Oracle"/>

    <p:outputLabel value="SQL" class="font-bold text-sm mb-2 block"/>
    <p:inputText value="#{visualEditorBean.elementProps.sql}"
                 styleClass="w-full"
                 placeholder="Select __ from __ where __ ... ;"/>
  </div>

  <div class="mt-4 flex flex-column gap-2 border-top-1 border-300 pt-3">
    <p:outputLabel value="Manual Options" class="font-bold text-sm text-primary"/>
    <span class="text-xs text-500 mb-1">
      Added alone or alongside the external source. One option per line.
      Format Format <code>value|text</code> (text is optional)
    </span>

    <p:inputTextarea value="#{visualEditorBean.manualOptionsText}"
                     rows="6"
                     styleClass="w-full"
                     placeholder="cat|Gat&#10;dog|Gos&#10;fish|Peix"
                     autoResize="false"
                     style="font-family: monospace;
                     font-size: 0.8rem;
                     line-height: 1.6;
                     letter-spacing: 0.03em;
                     background-color: var(--surface-ground);
                     border: 1px solid var(--surface-border);
                     padding: 0.75rem;"/>
  </div>

  <div class="flex gap-2 mt-3">
    <p:selectBooleanCheckbox value="#{visualEditorBean.elementProps.required}" />
    <p:outputLabel value="Required" class="font-bold text-sm"/>
  </div>

  <div class="flex gap-2 mt-2">
    <p:selectBooleanCheckbox value="#{visualEditorBean.elementProps.disabled}" />
    <p:outputLabel value="Disabled" class="font-bold text-sm"/>
  </div>

  <script type="text/javascript">
    //<![CDATA[
    // Show/Hide the selectMode panel
    function toggleSelectMode(mode) {
      let pEnum = document.querySelector('[id$="panel_ENUM"]');
      let pSql = document.querySelector('[id$="panel_SQL"]');

      if (pEnum) {
        pEnum.style.display = (mode === 'ENUM') ? 'flex' : 'none';
      }
      if (pSql) {
        pSql.style.display = (mode === 'SQL') ? 'flex' : 'none';
      }
    }
    // Execute to load the correct panel depening on the selectedMode
    (function () {
      var currentMode = '#{visualEditorBean.selectedMode}';
      if (currentMode && currentMode.length > 0) {
        toggleSelectMode(currentMode);
      }
    })();

    //]]>
  </script>
  
  <style>
    code {
      font-family: monospace;
      font-weight: bold;
      background: var(--surface-200);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      color: var(--primary-color);
    }
  </style>
</ui:composition>
