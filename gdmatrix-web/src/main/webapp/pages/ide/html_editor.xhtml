<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pe="http://primefaces.org/ui/extensions"
                xmlns:sf="http://faces.santfeliu.org"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:gdm="http://gdmatrix.org/faces">

  <div class="flex flex-column h-full overflow-x-hidden p-2">
    <p:outputPanel id="html_editor_toolbar" class="flex-grow-0 pt-2 pb-2 text-left"
                   rendered="#{ideBean.document.typeName eq 'form'}">
      <p:commandButton value="Repair All" 
                       icon="pi pi-cog"
                       process="@this code_editor" 
                       update="code_editor @(.ideTabLabel)"
                       onclick="cmChanged = true;"
                       action="#{htmlFormBean.repairAll()}" class="mini mr-1" /> 
      <p:commandButton value="Repair View Order" 
                       icon="pi pi-align-justify"
                       process="@this code_editor"
                       update="code_editor @(.ideTabLabel)"
                       onclick="cmChanged = true;"
                       action="#{htmlFormBean.repairViewOrder()}" class="mini mr-1" /> 
      <p:commandButton 
                      value="Repair Labels" 
                      icon="pi pi-tags"
                      process="@this code_editor"
                      update="code_editor @(.ideTabLabel)"
                      onclick="cmChanged = true;"
                      action="#{htmlFormBean.repairLabelsAndGroups()}" class="mini mr-1" />
      <p:commandButton value="Repair with AI" 
                             icon="mi-outlined mi-smart-toy"
                             type="button"
                             onclick="toggleAiPanel(); return false;" class="mini mt-1" />
    </p:outputPanel>

    <!-- AI PAnel -->
    <p:panel id="ai_panel" header="AI Tools" styleClass="p-shadow-2 ai-panel-container" 
             widgetVar="aiPanelWidget" style="display:none;">
             
      <div class="flex justify-content-between align-items-end">
        <p:outputLabel for="userPrompt" value="Additional AI prompt:" />
        
        <p:commandButton icon="pi pi-trash"
                         id="aiCleanPrompt"
                         widgetVar="aiCleanBtnWidget"
                         action="#{htmlFormBean.setUserPrompt('')}"
                         process='@this'
                         update="userPrompt"
                         oncomplete="setTimeout(toggleAiButtons, 20);"
                         styleClass="ui-button-flat ui-button-danger p-0"/> 
      </div>
      
      <p:inputTextarea id="userPrompt"
                       widgetVar="userPromptWidget"
                       value="#{htmlFormBean.userPrompt}"
                       rows="4"
                       autoResize="true"
                       styleClass="w-full mt-1"
                       oninput="toggleAiButtons();" />
                       
      <div class="flex justify-content-end mt-2">
        <p:commandButton value="Cancelar"
                         icon="pi pi-times"
                         type="button"
                         onclick="toggleAiPanel(); return false;"
                         styleClass="p-button-text mr-2"/>
                         
          <p:commandButton value="Aceptar"
                           id="aiAcceptBtn"
                           widgetVar="aiAcceptBtnWidget"
                           icon="pi pi-check"
                           process="@this userPrompt code_editor"
                           update="code_editor ai_panel @(.ideTabLabel)"
                           onclick="cmChanged = true;"
                           oncomplete="toggleAiPanel();"
                           action="#{htmlFormBean.repairAI()}" />
      </div>
    </p:panel>

    <gdm:codemirror id="code_editor" lineNumbers="true" language="html" 
                    value="#{ideBean.document.source}" changeListener="cmOnChange"
                    activeExtensions="#{ideBean.activeExtensionsJson}"/>
  </div>

  <script>
  function toggleAiPanel(){
    var aiPanel = PF('aiPanelWidget').jq;
    aiPanel.toggle();
    
    // Para hacer focus en el userPrompt, sinceramente no se si funcionará
    if (aiPanel.is(':visible')) {
      toggleAiButtons();
      PF('userPromptWidget').jq.focus();
    }
    
  }
  
  function toggleAiButtons(){
    var text = PF('userPromptWidget').jq.val();

    if (text.trim() === '') {
      PF('aiAcceptBtnWidget').disable();
      PF('aiCleanBtnWidget').disable();
    } else {
      PF('aiAcceptBtnWidget').enable();
      PF('aiCleanBtnWidget').enable();
    }
  }
 
  </script>
</ui:composition>
