<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:gdm="http://gdmatrix.org/faces">

  <p:outputPanel styleClass="nodeJsonPanel contentPanel"
         rendered="#{nodeEditBean.jsonTabSelected}">

    <p:outputPanel id="jsonToolsPanel" styleClass="buttonsPanel ui-inputgroup">
      <p:commandButton value="#{cmsBundle.save}" action="#{nodeEditBean.savePropertiesFromJSON}" 
                       icon="pi pi-save" title="#{cmsBundle.save}" styleClass="mini"
                       process="@this jsonTextPanel"
                       update=":mainform:topPanel :mainform:tree :mainform:rootSelectionPanel :mainform:rightPanel :mainform:messagesPanel" 
                       rendered="#{nodeEditBean.appendNodeEnabled}" />
      <p:commandButton value="#{cmsBundle.reload}" action="#{nodeEditBean.revertJSON}" 
                       icon="pi pi-undo" title="#{cmsBundle.reload}" styleClass="mini"                     
                       process="@this" update="jsonTextPanel :mainform:messagesPanel"
                       global="false"
                       rendered="#{nodeEditBean.appendNodeEnabled}" />
    </p:outputPanel>
    <p:outputPanel id="jsonTextPanel" styleClass="jsonTextPanel expand">
      <gdm:codemirror language="json"
                      styleClass="w-full"
                      value="#{nodeEditBean.jsonText}"
                      lineNumbers="true" />
    </p:outputPanel>

  </p:outputPanel>

</ui:composition>
