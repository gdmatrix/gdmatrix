<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:gdm="http://gdmatrix.org/faces">

  <p:outputPanel styleClass="nodeCSSPanel contentPanel" 
         rendered="#{nodeEditBean.cssTabSelected}">
    <p:outputPanel rendered="#{not nodeEditBean.validCSS}">
      <h:outputText value="#{cmsBundle.invalidCSS}" />
    </p:outputPanel>
    <div class="flex">
      <p:outputPanel id="cssToolsPanel" styleClass="buttonsPanel ui-inputgroup" 
                     rendered="#{nodeEditBean.validCSS}">      
        <p:commandButton value="#{cmsBundle.save}" action="#{nodeEditBean.saveCSS}" 
                         icon="pi pi-save" title="#{cmsBundle.save}" styleClass="mini"
                         process="@this cssTextPanel"
                         update=":mainform:tree :mainform:rightPanel :mainform:messagesPanel"
                         rendered="#{nodeEditBean.appendNodeEnabled}" />      
        <p:commandButton value="#{cmsBundle.reload}" action="#{nodeEditBean.revertCSS}" 
                         icon="pi pi-undo" title="#{cmsBundle.reload}" styleClass="mini"
                         process="@this" update="cssTextPanel :mainform:messagesPanel"
                         global="false"
                         rendered="#{nodeEditBean.appendNodeEnabled and nodeEditBean.customCSS}" />
        <p:commandButton value="#{cmsBundle.sync}" action="#{nodeEditBean.syncCSS}"
                         icon="pi pi-sync" title="#{cmsBundle.sync}" styleClass="mini"
                         process="@this cssTextPanel"
                         update=":mainform:messagesPanel"
                         rendered="#{nodeEditBean.syncCssButtonRender}" />
      </p:outputPanel>
      <h:outputLabel styleClass="noCSSLabel" rendered="#{not nodeEditBean.customCSS}" value="#{cmsBundle.noCustomCSS}" />
    </div>
    <p:outputPanel id="cssTextPanel" styleClass="cssTextPanel expand"
           rendered="#{nodeEditBean.validCSS}">
      <gdm:codemirror language="css" 
                      styleClass="w-full"
                      value="#{nodeEditBean.cssText}"
                      lineNumbers="true" />      
    </p:outputPanel>

  </p:outputPanel>  


</ui:composition>
